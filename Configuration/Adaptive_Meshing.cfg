# # # Klipper Adaptive Meshing # # #

# Heads up! If you have any other BED_MESH_CALIBRATE macros defined elsewhere in your config, you will need to comment out / remove them for this to work. (Klicky/Euclid Probe)
# You will also need to be sure that [exclude_object] is defined in printer.cfg, and your slicer is labeling objects.
# This macro will parse information from objects in your gcode to define a min and max mesh area to probe, creating an adaptive mesh!

# # # Adaptive probe count (custom branch) # # #
#
# Settings (in KAMP_Settings.cfg, in your config folder):
#   probe_count_min   Probes per axis for a tiny print. Odd number, default 3.
#   probe_count_max   Probes per axis when the print covers the whole bed. Odd number. 0 (default) = use the [bed_mesh] probe_count.
#
# [bed_mesh] probe_count in printer.cfg is the full-bed mesh density and the hard ceiling: probe_count_max can never exceed the
# smaller of its two values. To get a denser full-bed mesh, raise probe_count there first.
#
# How the number of probes is chosen, separately for X and Y:
#   fraction = adapted mesh width (or depth) / full bed mesh width (or depth)          0 = nothing, 1 = the whole bed
#   probes   = round( sqrt( min^2 + (max^2 - min^2) * fraction^2 ) )
# The total number of probes (X * Y) therefore grows in proportion to the area covered, from min^2 for a tiny print to max^2 for the
# full bed, and the spacing between probes stays close to the full-bed spacing. X and Y are scaled separately, so a long thin part
# gets more probes along its long side.
#   Example (bed 192.6 x 200.7 mm, min 3, max 11):  20x20 mm -> 3x3,  50x50 -> 4x4,  96x100 -> 6x6,  150x150 -> 9x8,  full bed -> 11x11.
#
# Rules applied on top of that:
#   - min and max are made odd (an even value is lowered by 1), so there is always a center probe. min never exceeds max.
#   - If either axis needs more than 6 points, the algorithm switches from lagrange to bicubic. Bicubic needs at least 5 points per
#     axis, so a long thin part can get a few more points on its short side than the formula gives.
#
# Console output (with verbose_enable): algorithm, adapted probe count, the min-max range, and a warning when probe_count_max
# was capped by [bed_mesh] probe_count.
#
# Differences from upstream KAMP: upstream derived the count from the full-bed probe spacing and clamped it between fixed limits (never
# above [bed_mesh] probe_count). That gave small parts a disproportionate mesh or a hard floor. This version scales smoothly with area
# between a configurable minimum and maximum, and takes the maximum from [bed_mesh] probe_count unless you set one.

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
gcode:

    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}                                # Gather all object points
    {% set bed_mesh_min = printer.configfile.settings.bed_mesh.mesh_min %}                                                          # Get bed mesh min from printer.cfg
    {% set bed_mesh_max = printer.configfile.settings.bed_mesh.mesh_max %}                                                          # Get bed mesh max from printer.cfg
    {% set probe_count = printer.configfile.settings.bed_mesh.probe_count %}                                                        # Get probe count from printer.cfg
    {% set kamp_settings = printer["gcode_macro _KAMP_Settings"] %}                                                                 # Pull variables from _KAMP_Settings
    {% set verbose_enable = kamp_settings.verbose_enable | abs %}                                                                   # Pull verbose setting from _KAMP_Settings
    {% set probe_dock_enable = kamp_settings.probe_dock_enable | abs %}                                                             # Pull probe dockable probe settings from _KAMP_Settings
    {% set attach_macro = kamp_settings.attach_macro | string %}                                                                    # Pull attach probe command from _KAMP_Settings
    {% set detach_macro = kamp_settings.detach_macro | string %}                                                                    # Pull detach probe command from _KAMP_Settings
    {% set mesh_margin = kamp_settings.mesh_margin | float %}                                                                       # Pull mesh margin setting from _KAMP_Settings
    {% set fuzz_amount = kamp_settings.fuzz_amount | float %}                                                                       # Pull fuzz amount setting from _KAMP_Settings
    {% set probe_count_min = kamp_settings.probe_count_min | int %}                                                                  # Pull minimum adaptive probe count
    {% set probe_count_max_setting = kamp_settings.probe_count_max | int %}                                                         # Pull maximum adaptive probe count (0 = use the [bed_mesh] probe_count)
    {% set probe_count = probe_count if probe_count|length > 1 else probe_count * 2  %}                                             # If probe count is only a single number, convert it to 2. E.g. probe_count:7 = 7,7
    {% set probe_count_ceiling = [probe_count[0], probe_count[1]] | min %}                                                          # The [bed_mesh] probe_count is the full-bed density and the hard ceiling
    {% set probe_count_max = probe_count_ceiling if probe_count_max_setting < 1 else [probe_count_max_setting, probe_count_ceiling] | min %}# Max: the KAMP setting, or the ceiling when it is 0; never above the ceiling
    {% set probe_count_max = probe_count_max - (1 if probe_count_max % 2 == 0 else 0) %}                                             # Use an odd maximum for a center probe
    {% set probe_count_min = [probe_count_min, probe_count_max] | min %}                                                             # Keep minimum at or below maximum
    {% set probe_count_min = probe_count_min + (1 if probe_count_min % 2 == 0 and probe_count_min < probe_count_max else (-1 if probe_count_min % 2 == 0 else 0)) %} # Use an odd minimum
    {% set x_min = all_points | map(attribute=0) | min | default(bed_mesh_min[0]) %}                                                # Set x_min from smallest object x point
    {% set y_min = all_points | map(attribute=1) | min | default(bed_mesh_min[1]) %}                                                # Set y_min from smallest object y point
    {% set x_max = all_points | map(attribute=0) | max | default(bed_mesh_max[0]) %}                                                # Set x_max from largest object x point
    {% set y_max = all_points | map(attribute=1) | max | default(bed_mesh_max[1]) %}                                                # Set y_max from largest object y point

    {% set fuzz_range = range((0) | int, (fuzz_amount * 100) | int + 1) %}                                                          # Set fuzz_range between 0 and fuzz_amount
    {% set adapted_x_min = x_min - mesh_margin - (fuzz_range | random / 100.0) %}                                                   # Adapt x_min to margin and fuzz constraints
    {% set adapted_y_min = y_min - mesh_margin - (fuzz_range | random / 100.0) %}                                                   # Adapt y_min to margin and fuzz constraints
    {% set adapted_x_max = x_max + mesh_margin + (fuzz_range | random / 100.0) %}                                                   # Adapt x_max to margin and fuzz constraints
    {% set adapted_y_max = y_max + mesh_margin + (fuzz_range | random / 100.0) %}                                                   # Adapt y_max to margin and fuzz constraints

    {% set adapted_x_min = [adapted_x_min , bed_mesh_min[0]] | max %}                                                               # Compare adjustments to defaults and choose max
    {% set adapted_y_min = [adapted_y_min , bed_mesh_min[1]] | max %}                                                               # Compare adjustments to defaults and choose max
    {% set adapted_x_max = [adapted_x_max , bed_mesh_max[0]] | min %}                                                               # Compare adjustments to defaults and choose min
    {% set adapted_y_max = [adapted_y_max , bed_mesh_max[1]] | min %}                                                               # Compare adjustments to defaults and choose min

    {% set fraction_x = [[(adapted_x_max - adapted_x_min) / (bed_mesh_max[0] - bed_mesh_min[0]), 0.0] | max, 1.0] | min %}          # Share of the bed width covered by the adapted mesh (0 to 1)
    {% set fraction_y = [[(adapted_y_max - adapted_y_min) / (bed_mesh_max[1] - bed_mesh_min[1]), 0.0] | max, 1.0] | min %}          # Share of the bed depth covered by the adapted mesh (0 to 1)

    {% set points_x = ((probe_count_min ** 2 + (probe_count_max ** 2 - probe_count_min ** 2) * fraction_x ** 2) ** 0.5 + 0.5) | int %}# Scale x probes so the total probe count follows the mesh area: min for a tiny part, max for the full bed
    {% set points_y = ((probe_count_min ** 2 + (probe_count_max ** 2 - probe_count_min ** 2) * fraction_y ** 2) ** 0.5 + 0.5) | int %}# Scale y probes so the total probe count follows the mesh area: min for a tiny part, max for the full bed

    {% if (([points_x, points_y]|max) > 6) %}                                                                                       #
        {% set algorithm = "bicubic" %}                                                                                             # 
        {% set min_points = 5 %}                                                                                                    # Keep the bicubic fallback odd
    {% else %}                                                                                                                      # Calculate if algorithm should be bicubic or lagrange
        {% set algorithm = "lagrange" %}                                                                                            # 
        {% set min_points = 3 %}                                                                                                    # 
    {% endif %}                                                                                                                     # 

    {% set points_x = [points_x, min_points]|max %}                                                                                 # Set x points to fit the calculated algorithm
    {% set points_y = [points_y, min_points]|max %}                                                                                 # Set y points to fit the calculated algorithm

    {% if verbose_enable == True %}                                                                                                 # If verbose is enabled, print information about KAMP's calculations
        {% if printer.exclude_object.objects != [] %}

            { action_respond_info( "Algorithm: {}.".format(                                                                              
                (algorithm),                                                                                                            
            )) }

            { action_respond_info("Default probe count: {},{}.".format(                                                                  
                (probe_count[0]),                                                                                                       
                (probe_count[1]),                                                                                                       
            )) }

            { action_respond_info("Adapted probe count: {},{}.".format(                                                                  
                (points_x),                                                                                                             
                (points_y),                                                                                                             
            )) }                                                                                                              

            { action_respond_info("Probe count range: {} to {} per axis.".format(
                (probe_count_min),
                (probe_count_max),
            )) }

            {% if probe_count_max_setting > probe_count_max %}
                { action_respond_info("probe_count_max is {}, but [bed_mesh] probe_count is {},{}: using {}. Raise probe_count in [bed_mesh] to allow more.".format(
                    (probe_count_max_setting),
                    (probe_count[0]),
                    (probe_count[1]),
                    (probe_count_max),
                )) }
            {% endif %}

            {action_respond_info("Default mesh bounds: {}, {}.".format(                                                                  
                (bed_mesh_min[0],bed_mesh_min[1]),                                                                                      
                (bed_mesh_max[0],bed_mesh_max[1]),                                                                                      
            )) }

            {% if mesh_margin > 0 %}                                                                                                    
                {action_respond_info("Mesh margin is {}, mesh bounds extended by {}mm.".format(                                       
                    (mesh_margin),                                                                                                      
                    (mesh_margin),                                                                                       
                )) }                                                                                                                    
            {% else %}                                                                                                                  
                {action_respond_info("Mesh margin is 0, margin not increased.")}                                                        
            {% endif %}                                                                                                                 

            {% if fuzz_amount > 0 %}                                                                                                    
                {action_respond_info("Mesh point fuzzing enabled, points fuzzed up to {}mm.".format(                                     
                    (fuzz_amount),                                                                                                      
                )) }                                                                                                                    
            {% else %}                                                                                                                  
                {action_respond_info("Fuzz amount is 0, mesh points not fuzzed.")}                                                      
            {% endif %}                                                                                                                 

            { action_respond_info("Adapted mesh bounds: {}, {}.".format(                                                                 
                (adapted_x_min, adapted_y_min),                                                                                         
                (adapted_x_max, adapted_y_max),                                                                                         
            )) }

            {action_respond_info("KAMP adjustments successful. Happy KAMPing!")}

        {% else %}

            {action_respond_info("No objects detected! Check your gcode and make sure that EXCLUDE_OBJECT_DEFINE is happening before BED_MESH_CALIBRATE is called. Defaulting to regular meshing.")}
            G4 P5000                                                                                                                # Wait 5 seconds to make error more visible
        {% endif %}

    {% endif %}

    {% if probe_dock_enable == True %}
        {attach_macro}                                                                                                              # Attach/deploy a probe if the probe is stored somewhere outside of the print area
    {% endif %}

    _BED_MESH_CALIBRATE mesh_min={adapted_x_min},{adapted_y_min} mesh_max={adapted_x_max},{adapted_y_max} ALGORITHM={algorithm} PROBE_COUNT={points_x},{points_y}

    {% if probe_dock_enable == True %}
        {detach_macro}                                                                                                              # Detach/stow a probe if the probe is stored somewhere outside of the print area
    {% endif %}                                                                                                                     # End of verbose
